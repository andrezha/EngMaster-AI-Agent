name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: Build EXE
      run: |
        python -m PyInstaller --onefile --windowed --clean --add-data "resources;resources" --add-data "lib;lib" --add-data "data;data" --add-data "assets;assets" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Windows-Program
        path: dist/