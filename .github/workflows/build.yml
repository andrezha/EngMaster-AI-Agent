name: Build Windows EXE (Final Production)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 确保安装 PyQt5 及项目可能用到的额外库
        pip install PyQt5 pyinstaller
        # 如果你有 requirements.txt，建议取消下行注释
        # pip install -r requirements.txt

    - name: Build EXE
      shell: pwsh
      run: |
        # 首席架构师提示：
        # 纯单词版不打包题库、考试页面或考试解析模块。
        pyinstaller --noconfirm --onedir --windowed --clean `
          --name "高考英语智胜工作站" `
          --add-data "resources/main_window.ui;resources" `
          --add-data "resources/style.qss;resources" `
          --add-data "assets;assets" `
          main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GaoKao-AI-Full-Release
        path: dist/
